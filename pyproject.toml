[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reticulated"
version = "1.0.3"
description = "Reticulum Network Stack Simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
authors = [
  { name = "RFnexus" }
]
dependencies = [
  "rns",
  "lxmf",
  "fastapi",
  "uvicorn[standard]",
  "websockets",
  "msgpack",
  "psutil>=5.9.0",
  "tomli>=2.0.0; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/RFnexus/reticulated"
Repository = "https://github.com/RFnexus/reticulated"

[project.scripts]
reticulated = "run:main"
reticulated-scenario = "sim.scenario:main"
reticulated-dashboard = "sim.dashboard:main"
reticulated-lab = "sim.lab:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.setuptools.package-data]
"sim.dashboard_assets" = ["*.html", "*.css", "*.js"]
